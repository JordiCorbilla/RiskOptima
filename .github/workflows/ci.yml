name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest pytest-cov hypothesis "QuantLib>=1.34" ruff build "mypy>=1.10,<2"

      - name: Run type checks
        run: python -m mypy --python-version "${{ matrix.python-version }}" riskoptima

      - name: Lint Python
        run: |
          python -m ruff check --select E9,F63,F7,F82 riskoptima tests examples scripts
          python -m ruff check riskoptima/optim/_forecast.py riskoptima/risk/_tail.py tests/test_phase1_numerical_integrity.py scripts

      - name: Run tests and enforce coverage
        run: |
          python -m pytest -q --cov=riskoptima --cov-branch --cov-report=term-missing --cov-report=json:coverage.json
          python scripts/check_coverage.py coverage.json

      - name: Build distribution artifacts
        run: python -m build
