name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest build "mypy>=1.10,<2"

      - name: Run type checks
        run: python -m mypy --python-version "${{ matrix.python-version }}" riskoptima

      - name: Run tests
        run: pytest -q tests

      - name: Build distribution artifacts
        run: python -m build
